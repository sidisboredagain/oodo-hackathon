    <!-- Tailwind CDN with Black / White / Gold theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              gold: {
                DEFAULT: '#d4a017',
                light: '#f0c14b',
                dark: '#b8860b',
              },
            },
          },
        },
      }
    </script>

    <link rel="stylesheet" href="/assets/hrms-theme.css">

    <style>
      html, body { background: #0a0a0a !important; color: #fff; }
      input:focus, button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.3);
      }
      /* Remap blue/violet accents to gold */
      .bg-blue-600, .bg-blue-500 { background-color: #d4a017 !important; color: #0a0a0a !important; }
      .hover\:bg-blue-500:hover, .hover\:bg-blue-600:hover { background-color: #b8860b !important; }
      .text-blue-400, .text-blue-500, .text-blue-300 { color: #f0c14b !important; }
      .border-blue-500, .border-blue-500\/30, .border-blue-500\/20 { border-color: rgba(212,160,23,0.4) !important; }
      .from-blue-600 { --tw-gradient-from: #d4a017 !important; }
      .to-indigo-500, .to-indigo-600 { --tw-gradient-to: #b8860b !important; }
      .ring-blue-500 { --tw-ring-color: #d4a017 !important; }
      .bg-blue-500\/10, .bg-blue-500\/15 { background-color: rgba(212,160,23,0.12) !important; }
      .bg-violet-500\/20, .bg-violet-500\/15 { background-color: rgba(212,160,23,0.15) !important; }
      .text-violet-300, .text-violet-400 { color: #f0c14b !important; }
      .border-violet-500\/30 { border-color: rgba(212,160,23,0.3) !important; }
      .shadow-blue-600\/20, .shadow-blue-600\/25, .shadow-blue-500\/20 {
        box-shadow: 0 10px 15px -3px rgba(212,160,23,0.2) !important;
      }
    </style>
